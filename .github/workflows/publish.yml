name: publish-reel

# Fired by the Worker when the user taps "✅ Post it" in Telegram.
# The reel is already hosted by the build phase — this only talks to Instagram.
on:
  repository_dispatch:
    types: [publish-reel]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish to Instagram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_USERNAME: "tshirtsandtrousers_"
          PAGES_BASE: "https://uzairiqbal.github.io/tt-assets"
        run: node ci/publish.js
