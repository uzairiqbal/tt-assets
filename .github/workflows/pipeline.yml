name: reel-pipeline

on:
  repository_dispatch:
    types: [new-shirt]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to push the reel for GitHub Pages hosting
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node deps (sharp for local engine)
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache rembg AI model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-u2net-v1

      - name: Install rembg (free background removal)
        run: pip install "rembg[cli]" onnxruntime

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Run pipeline and reply on Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PHOTOROOM_API_KEY: ${{ secrets.PHOTOROOM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGES_BASE: "https://uzairiqbal.github.io/tt-assets"
          BRAND_BG_PROMPT: "a clean minimal light neutral studio background, soft even lighting, premium streetwear catalog"
          SECONDS_PER_SHOT: "4"
          IG_USERNAME: "tshirtsandtrousers_"
        run: node ci/run.js
