<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Auth — TShirts &amp; Trousers Studio Bot</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 500px; margin: 80px auto; padding: 0 24px; color: #1a1a1a; text-align: center; }
  h1 { font-size: 1.4rem; }
  .code-box { background: #f5f5f5; border: 2px solid #ddd; border-radius: 8px; padding: 16px 20px; font-family: monospace; font-size: 1rem; word-break: break-all; margin: 20px 0; cursor: pointer; position: relative; }
  .code-box:hover { border-color: #999; }
  .copy-btn { background: #1a1a1a; color: #fff; border: none; border-radius: 6px; padding: 10px 24px; font-size: 0.95rem; cursor: pointer; margin-top: 8px; }
  .copy-btn:active { background: #333; }
  .copied { color: #28a745; font-size: 0.9rem; margin-top: 8px; display: none; }
  .error { color: #dc3545; }
  .note { color: #888; font-size: 0.85rem; margin-top: 32px; }
</style>
</head>
<body>
<h1>TikTok Authorization</h1>
<div id="content"></div>
<script>
const params = new URLSearchParams(window.location.search);
const code = params.get('code');
const error = params.get('error');
const div = document.getElementById('content');

if (error) {
  div.innerHTML = `<p class="error">⚠️ Authorization failed: <strong>${error}</strong></p>
<p>${params.get('error_description') || ''}</p>
<p>Close this tab and re-run the script to try again.</p>`;
} else if (code) {
  div.innerHTML = `
<p>✅ Authorization successful. Copy the code below and paste it into the terminal.</p>
<div class="code-box" id="codeBox">${code}</div>
<button class="copy-btn" onclick="copyCode()">Copy Code</button>
<p class="copied" id="copied">✓ Copied!</p>
<p class="note">This code expires in a few minutes. Paste it into the terminal promptly, then close this tab.</p>`;
} else {
  div.innerHTML = `<p>No authorization code found. This page is only useful after TikTok redirects to it during OAuth. Run the <code>get-tiktok-token.js</code> script to start the flow.</p>`;
}

function copyCode() {
  navigator.clipboard.writeText(code).then(() => {
    document.getElementById('copied').style.display = 'block';
    setTimeout(() => document.getElementById('copied').style.display = 'none', 2500);
  });
}
</script>
</body>
</html>
